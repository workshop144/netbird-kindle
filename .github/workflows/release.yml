name: release

# Push a tag like v0.1.0 to build the archive and attach it to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must be a plain version such as v0.2.0
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - run: make dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/netbird-kindle.zip dist/netbird-kindle_*.kpkg dist/repo.json dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
